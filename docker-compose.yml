
services:
  # 1. The Core Spatial Engine
  postgis:
    image: postgis/postgis:15-3.3
    container_name: agce_spatial_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: groundwater_db
    ports:
      - "5433:5432" # Mapping to 5433 to avoid conflicts if you have a local Postgres install
    volumes:
      - pg_data:/var/lib/postgresql/data
    shm_size: 1g # CRITICAL: Allocates 1GB of RAM for heavy spatial index building
    restart: unless-stopped

  # 2. The Database GUI Manager
  pgadmin:
    image: dpage/pgadmin4
    container_name: agce_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agce.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgis
    restart: unless-stopped

# Ensures your data survives even if the container is deleted
volumes:
  pg_data: